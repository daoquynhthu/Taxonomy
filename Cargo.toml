[workspace]
resolver = "3"
members = [
    "crates/eternal-format",
    "crates/eternal-store",
    "crates/eternal-core",
    "crates/eternal-crypto",
    "crates/eternal-net",
    "crates/eternal-cli",
]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.package]
version = "4.0.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/daoquynhthu/Taxonomy"
homepage = "https://github.com/daoquynhthu/Taxonomy"
