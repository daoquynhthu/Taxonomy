[package]
name = "eternal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "EternalCore command-line interface"

[[bin]]
name = "eternal"
path = "src/main.rs"

[dependencies]
eternal-core = { path = "../eternal-core" }
eternal-net = { path = "../eternal-net" }
eternal-format = { path = "../eternal-format" }
eternal-crypto = { path = "../eternal-crypto" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
indicatif = "0.17"
