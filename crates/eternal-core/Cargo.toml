[package]
name = "eternal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Repository logic, transactions, SMT, commits, merge, and GC for EternalCore"

[dependencies]
eternal-format = { path = "../eternal-format" }
eternal-store = { path = "../eternal-store" }
eternal-crypto = { path = "../eternal-crypto" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
redb = "2"
uuid = { version = "1", features = ["v4", "serde"] }
